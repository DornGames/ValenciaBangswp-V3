<!DOCTYPE html>
<html lang="zh-CN">
<!--
    更新日志：2026-07-31 第二十九阶段
    - 例句渲染使用 highlightSentence 高亮相关词汇
    - 新增 .example-highlight CSS 样式（主色粗体+浅色背景）
    - 引用 exampleUtils.js 获取高亮函数
    -->

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALENCIA | 单词详情</title>
    <link rel="icon" href="https://satorna.github.io/image/webIcon.png">
    <link rel="stylesheet" href="../css/main.css">
    <script src="../js/tools.js"></script>
    <script src="../js/wordData.js"></script>
    <script src="../js/exampleData.js"></script>
    <script src="../js/exampleUtils.js"></script>
    <script src="../js/components.js"></script>
    <style>
        /* 单词详情页专属样式 */
        .detail-container {
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--spacing-xl) var(--spacing-lg);
            animation: fadeIn 0.4s ease forwards;
        }

        .detail-container .word-card {
            margin-bottom: var(--spacing-lg);
        }

        /* 例句区域 */
        .examples-section {
            background: var(--color-white);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-border-light);
            transition: all 0.2s ease;
        }

        .examples-section:hover {
            box-shadow: var(--shadow-lg);
        }

        .examples-section-title {
            font-size: var(--font-size-md);
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
            border-bottom: 1px solid var(--color-border-light);
            letter-spacing: 0.5px;
        }

        .example-item {
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            background: var(--color-bg);
            margin-bottom: var(--spacing-sm);
            transition: background 0.15s ease;
            border-left: 3px solid var(--color-accent);
        }

        .example-item:last-child {
            margin-bottom: 0;
        }

        .example-item:hover {
            background: var(--color-primary-light);
        }

        .example-dh {
            font-family: var(--font-family-en);
            font-size: var(--font-size-sm);
            color: var(--color-text);
            font-weight: 500;
            line-height: 1.6;
        }

        .example-cn {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-top: 4px;
            line-height: 1.6;
        }

        .example-count {
            font-size: var(--font-size-xs);
            color: var(--color-text-muted);
            margin-bottom: var(--spacing-md);
        }

        .no-examples {
            text-align: center;
            padding: var(--spacing-2xl) var(--spacing-lg);
            color: var(--color-text-muted);
            font-size: var(--font-size-sm);
        }

        .no-examples-icon {
            font-size: 32px;
            margin-bottom: var(--spacing-sm);
            opacity: 0.5;
        }

        /* 回退提示 */
        .fallback-message {
            text-align: center;
            padding: var(--spacing-3xl) var(--spacing-lg);
            color: var(--color-text-secondary);
        }

        .fallback-message h2 {
            font-size: var(--font-size-lg);
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
            font-weight: 600;
        }

        .fallback-message p {
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
            line-height: 1.8;
        }

        .fallback-message .back-link {
            display: inline-block;
            margin-top: var(--spacing-lg);
            padding: 8px 24px;
            background: var(--color-primary);
            color: var(--color-white);
            border-radius: var(--radius-full);
            font-size: var(--font-size-sm);
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .fallback-message .back-link:hover {
            background: var(--color-primary-hover);
            box-shadow: 0 2px 8px rgba(122, 80, 72, 0.2);
        }

        /* 分词来源提示 */
        .participle-origin {
            font-size: var(--font-size-xs);
            color: var(--color-accent);
            margin-top: 2px;
            font-style: italic;
        }

        /* 例句高亮 */
        .example-highlight {
            color: var(--color-primary);
            font-weight: 700;
            background: var(--color-primary-light);
            padding: 0 2px;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .detail-container {
                padding: var(--spacing-md);
            }
            .examples-section {
                padding: var(--spacing-md);
            }
            .example-item {
                padding: var(--spacing-sm);
            }
        }
    </style>
</head>

<body>
    <header id="nav">
        <div id="navLogo">
            <span id="navLogo-en">th valencia bangswp</span>
            <span id="navLogo-zh">瓦来西雅大辞典</span>
        </div>
        <input type="checkbox" id="navMenuToggle" />
        <nav id="navMar">
            <button id="navbut1">主站</button>
            <button id="navbut2">字母表</button>
            <button id="navbut3">词缀表</button>
            <button id="navbut4">时态表</button>
            <button id="navbut5">学习资源</button>
        </nav>
        <button id="navbut_user">翻 译</button>
        <label id="navToggle" for="navMenuToggle"><span></span></label>
    </header>

    <main class="container" id="ctn">
        <div class="detail-container" id="detailContainer">
            <!-- 内容将由 JavaScript 动态渲染 -->
        </div>
    </main>

    <footer id="bottom_div">
        <div id="copyright">
            <div id="br"></div>
            <p>所有内容纯属虚构，与现实无关，敬请理性看待</p>
            <p id="cprt">版权所有 &copy; 2025 DornGames | Ver V3.1</p>
            <p>Box3Pro : <a href="https://dao3.fun/profile/50450184">@DornGames</a>
             | Github : <a href="https://github.com/dornhub">@dornhub</a>
             | Email : dorngames@163.com
            </p>
            <div id="br"></div>
        </div>
    </footer>
</body>

<script>
    // 分词推导工具函数由 exampleUtils.js 提供
    // 可用函数：getOriginalVerb, getParticipleForms, getParticipleLabel,
    //          isParticipleType, findExamplesForWord, splitSentenceTokens

    // ============================================
    // 主逻辑
    // ============================================

    try {
        initNav(true);
    } catch (e) {
        console.error('[tondhæDetail] initNav error:', e);
    }
    try {
        initFooter();
    } catch (e) {
        console.error('[tondhæDetail] initFooter error:', e);
    }

    var container = document.getElementById('detailContainer');

    try {
        // 获取 URL 参数
        var params = getQueryParams(window.location.href);
        var wordRaw = params.s;

        if (!wordRaw) {
            // 无参数：显示回退提示
            container.innerHTML =
                '<div class="fallback-message">' +
                    '<h2>未能获取单词信息</h2>' +
                    '<p>请通过在 URL 中添加 <code>s</code> 参数来查询单词详情。</p>' +
                    '<p>例如：<code>tondhæDetail.html?s="rerr"</code></p>' +
                    '<div class="back-link" onclick="window.open(\'search.html\',\'_self\')">前往搜索页面</div>' +
                '</div>';
        } else {
            var word = String(JSON.parse(wordRaw));
            var detail = null;
            var isParticipleMatch = false;
            for (var i = 0; i < wordData.length; i++) {
                if (wordData[i].dh === word) {
                    detail = wordData[i];
                    break;
                }
            }

            if (!detail) {
                // 未找到单词，尝试通过分词反向查找原动词
                var participleResult = findOriginalVerbByParticiple(word, wordData);
                if (participleResult) {
                    detail = participleResult.entry;
                    var participleType = participleResult.participleType;
                    var participleLabel = getParticipleLabel(participleType);
                    // 标记为分词来源，稍后显示提示
                    var isParticipleMatch = true;
                } else {
                    container.innerHTML =
                        '<div class="fallback-message">' +
                            '<h2>未找到该单词</h2>' +
                            '<p>词典中未收录 <strong>' + word + '</strong>，请检查拼写。</p>' +
                            '<div class="back-link" onclick="window.open(\'search.html\',\'_self\')">前往搜索页面</div>' +
                        '</div>';
                }
            }
            if (detail) {
                // 找到单词：渲染详情
                var dhIrelav = '';
                try {
                    dhIrelav = detail.dh.wordConvert('irelav');
                } catch (e) {
                    dhIrelav = detail.dh;
                }

                var typeInfo = detail.type;
                var cnInfo = detail.cn;

                // 查找相关例句（使用 exampleUtils.js 的算法）
                var relatedExamples = findExamplesForWord(detail.dh, detail.type, exampleData, wordData);

                // 构建例句 HTML
                var examplesHtml = '';
                if (relatedExamples.length > 0) {
                    examplesHtml += '<div class="example-count">共 ' + relatedExamples.length + ' 条相关例句</div>';
                    for (var e = 0; e < relatedExamples.length; e++) {
                        var ex = relatedExamples[e];
                        var highlightedDh = highlightSentence(ex.dh, detail.dh, detail.type, wordData);
                        examplesHtml +=
                            '<div class="example-item">' +
                                '<div class="example-dh">' + highlightedDh + '</div>' +
                                '<div class="example-cn">' + ex.cn + '</div>' +
                            '</div>';
                    }
                } else {
                    examplesHtml =
                        '<div class="no-examples">' +
                            '<div class="no-examples-icon">-</div>' +
                            '<p>暂无例句</p>' +
                        '</div>';
                }

                // 分词来源信息
                var originInfo = '';
                if (isParticipleMatch) {
                    // 用户搜索的是分词，自动匹配到原动词
                    originInfo = '<div class="participle-origin">您查找的是 <strong>' + word + '</strong>（' + participleLabel + '），属于动词 <strong>' + detail.dh + '</strong> 的分词形式</div>';
                } else {
                    // 当前单词本身就是分词，显示其原动词
                    var originalDh = getOriginalVerb(detail.dh, detail.type);
                    if (originalDh) {
                        var originalWord = null;
                        for (var i = 0; i < wordData.length; i++) {
                            if (wordData[i].dh === originalDh) {
                                originalWord = wordData[i];
                                break;
                            }
                        }
                        if (originalWord) {
                            var pLabel = getParticipleLabel(detail.type);
                            originInfo = '<div class="participle-origin">← ' + pLabel + '，原动词：<strong>' + originalWord.dh + '</strong>（' + originalWord.cn + '）</div>';
                        }
                    }
                }

                // 渲染完整页面
                container.innerHTML =
                    '<div class="word-card">' +
                        '<div class="word-card-left">' +
                            '<span id="mainWord_dh">' + dhIrelav + '</span>' +
                            '<span id="mainWord_lt">|' + detail.dh + '|</span>' +
                        '</div>' +
                        '<div class="word-card-right">' +
                            '<span id="mainWord_type">' + typeInfo + '</span>' +
                            '<span id="mainWord_cn">' + cnInfo + '</span>' +
                        '</div>' +
                    '</div>' +
                    originInfo +
                    '<div class="examples-section">' +
                        '<div class="examples-section-title">相关例句</div>' +
                        examplesHtml +
                    '</div>';
            }
        }
    } catch (e) {
        console.error('[tondhæDetail] 渲染错误:', e);
        container.innerHTML =
            '<div class="fallback-message">' +
                '<h2>参数错误</h2>' +
                '<p>查询参数无效，请检查 URL 格式。</p>' +
                '<div class="back-link" onclick="window.open(\'search.html\',\'_self\')">前往搜索页面</div>' +
            '</div>';
    }
</script>

</html>
